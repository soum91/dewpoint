name: DewPoint
options:
  bundleIdPrefix: com.dewpoint
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  DewPoint:
    type: application
    platform: iOS
    sources:
      - App/Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: DewPoint
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "DewPoint listens to your Govee thermometer over Bluetooth to show temperature and humidity."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dewpoint.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
