name: Build iOS app

on:
  push:
    branches: [main]
    paths: ["App/**", "project.yml", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DewPoint.xcodeproj \
            -scheme DewPoint \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DewPoint.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish build log (so it can be read via API)
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-logs-ios
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > ci-build.log || echo "no build.log produced" > ci-build.log
          git add -f ci-build.log
          git commit -m "CI build log for ${GITHUB_SHA}" || true
          git push -f origin ci-logs-ios

      - name: Package into unsigned .ipa
        run: |
          APP_DIR="$RUNNER_TEMP/DewPoint.xcarchive/Products/Applications"
          cd "$APP_DIR"
          mkdir -p Payload
          cp -R DewPoint.app Payload/
          mkdir -p "$GITHUB_WORKSPACE/dist"
          zip -qr "$GITHUB_WORKSPACE/dist/DewPoint-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DewPoint-unsigned-ipa
          path: dist/DewPoint-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to dist branch (readable via API)
        if: success()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B dist
          cp "$GITHUB_WORKSPACE/dist/DewPoint-unsigned.ipa" DewPoint-unsigned.ipa
          git add -f DewPoint-unsigned.ipa
          git commit -m "IPA for ${GITHUB_SHA}" || true
          git push -f origin dist
