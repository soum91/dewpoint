name: Build iOS app

on:
  push:
    branches: [main]
    paths: ["App/**", "project.yml", ".github/workflows/ios.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: DewPoint
  BUILD: ${{ github.run_number }}
  TAG: build-${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DewPoint.xcodeproj \
            -scheme DewPoint \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DewPoint.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=$BUILD \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish build log (so it can be read via API)
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-logs-ios
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > ci-build.log || echo "no build.log produced" > ci-build.log
          git add -f ci-build.log
          git commit -m "CI build log for ${GITHUB_SHA}" || true
          git push -f origin ci-logs-ios
          git checkout -f "$GITHUB_SHA"

      - name: Package into unsigned .ipa
        run: |
          APP_DIR="$RUNNER_TEMP/DewPoint.xcarchive/Products/Applications"
          cd "$APP_DIR"
          mkdir -p Payload
          cp -R DewPoint.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/DewPoint.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/DewPoint.app/Info.plist)
          # Sideloaders (FlareStore etc.) only compare the version string, so make it <version>.<build>.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" Payload/DewPoint.app/Info.plist
          IPA="$APP-$VERSION-build-$BUILD.ipa"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          zip -qr "$GITHUB_WORKSPACE/dist/$IPA" Payload
          ls -lh "$GITHUB_WORKSPACE/dist"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Changelog
        run: |
          .github/scripts/release-notes.sh "$APP" "$VERSION" "$BUILD" 'build-*' "$TAG" \
            "Unsigned IPA. Sideload with AltStore, SideStore, Sideloadly or TrollStore." > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-build-${{ env.BUILD }}-ipa
          path: dist/${{ env.IPA }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DewPoint ${{ env.VERSION }} build ${{ env.BUILD }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/${{ env.IPA }}
          make_latest: true

      - name: Update sideloading source (FlareStore / AltStore / SideStore)
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$IPA"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/source"
            if git fetch -q origin source; then
              git worktree add -q -f --detach "$RUNNER_TEMP/source" FETCH_HEAD
            else
              git worktree add -q -f --detach "$RUNNER_TEMP/source"
              git -C "$RUNNER_TEMP/source" checkout -q --orphan source
              git -C "$RUNNER_TEMP/source" rm -rqf .
            fi
            python3 .github/scripts/update-source.py "$RUNNER_TEMP/source/source.json" "dist/$IPA" "$URL" "$RUNNER_TEMP/release-notes.md"
            git -C "$RUNNER_TEMP/source" add source.json
            git -C "$RUNNER_TEMP/source" commit -qm "Source: $APP build $BUILD"
            git -C "$RUNNER_TEMP/source" push -q origin HEAD:refs/heads/source && break
            git worktree remove -f "$RUNNER_TEMP/source"
            sleep 5
          done

      - name: Publish IPA to dist branch (readable via API)
        if: success()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B dist
          cp "$GITHUB_WORKSPACE/dist/$IPA" DewPoint-unsigned.ipa
          git add -f DewPoint-unsigned.ipa
          git commit -m "IPA build $BUILD for ${GITHUB_SHA}" || true
          git push -f origin dist
