name: Backfill release build numbers and changelogs

# One-off. Run it from the Actions tab: turns the rolling "latest" release
# into "DewPoint 1.0 build 5" (tag build-5), renames its IPA to
# DewPoint-1.0-build-5.ipa and writes a changelog into the notes.
# Safe to run again. Delete this file once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APP: DewPoint
      ROLLING: "5:96eb353"
      INSTALL: Unsigned IPA. Sideload with AltStore, SideStore, Sideloadly or TrollStore.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/backfill-releases.py
